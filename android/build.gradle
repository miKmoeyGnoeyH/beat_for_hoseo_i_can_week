// 루트 빌드 스크립트 (android/build.gradle)

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Flutter 최신 템플릿이 사용하는 공통 빌드 폴더 설정
rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

// clean task
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

